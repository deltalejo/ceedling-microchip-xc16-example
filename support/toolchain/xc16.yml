---
:tools:
  :test_compiler:
    :name: xc16_test_compiler
    :executable: xc16-gcc
    :arguments:
      - -I"${5}"
      - -D${6}
      - -mcpu=#{ENV['DEVICE'].upcase.sub(/^\D+/, "")}
      - -mdfp=#{File.join(ENV['MPLABX_PATH'], 'packs/Microchip', ENV['DFP'])}
      - -g
      - -Wall
      - -Wextra
      - -Werror
      - -Wno-pragmas
      - -merrata=all
      - -ffunction-sections
      - -MMD
      - -MF ${4}
      - -Wa,-adhilmn=${3}
      - -c
      - -o ${2}
      - ${1}
  :test_linker:
    :name: xc16_test_linker
    :executable: xc16-gcc
    :arguments:
      - ${5}
      - ${4}
      - -mcpu=#{ENV['DEVICE'].upcase.gsub(/^\D+/, "")}
      - -mdfp=#{File.join(ENV['MPLABX_PATH'], 'packs/Microchip', ENV['DFP'])}
      - -Tp#{ENV['DEVICE'].upcase.gsub(/^\D+/, "")}.gld
      - -Wl,--gc-sections
      - -Wl,-Map=${3}
      - -o ${2}
      - ${1}
...
